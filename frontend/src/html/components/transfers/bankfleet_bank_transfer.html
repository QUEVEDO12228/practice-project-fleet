<section class="bankfleet-transfer-bank">
    <div class="bankfleet-transfer-bank__content">
        <header class="bankfleet-transfer-bank__header">
            <a href="/frontend/src/html/pages/dashboard/banking/transfers/cards/vista_bankfleet_new_transfer.html" class="bankfleet-btn-secondary">
                <img src="/frontend/public/assets/icons/icon_back.svg" alt="Atrás" class="bankfleet-btn-secondary__icon">
            </a>
            <div class="bankfleet-transfer-bank__header-content">
                <h2 class="bankfleet-transfer-bank__title">Transferencia Bancaria</h2>
                <div class="bankfleet-transfer-bank__header-texts">
                    <p class="bankfleet-transfer-bank__subtitle">Realiza envíos a cuentas de ahorro o corriente de cualquier entidad financiera nacional.</p>
                    <span class="bankfleet-transfer-bank__badge">Cuenta Bancaria</span>
                </div>
            </div>
        </header>
        <form class="bankfleet-transfer-bank__form">
            <div class="bankfleet-transfer-bank__grid">
                <div class="bankfleet-transfer-bank__field">
                    <label class="bankfleet-transfer-bank__label">Cuenta origen</label>
                    <select class="bankfleet-transfer-bank__input">
                        <option>Cuenta Ahorros • ****4587</option>
                        <option>Cuenta Corriente • ****9831</option>
                    </select>
                </div>
                <div class="bankfleet-transfer-bank__field">
                    <label class="bankfleet-transfer-bank__label">Banco destino</label>
                    <select class="bankfleet-transfer-bank__input">
                        <option>Bancolombia</option>
                        <option>Davivienda</option>
                        <option>Banco de Bogotá</option>
                        <option>BBVA</option>
                        <option>Nequi</option>
                        <option>Otro banco</option>
                    </select>
                </div>
                <div class="bankfleet-transfer-bank__field">
                    <label class="bankfleet-transfer-bank__label">Tipo de cuenta</label>
                    <select class="bankfleet-transfer-bank__input">
                        <option>Ahorros</option>
                        <option>Corriente</option>
                    </select>
                </div>
                <div class="bankfleet-transfer-bank__field">
                    <label class="bankfleet-transfer-bank__label">Número de cuenta</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-bank__input"
                        placeholder="Ej: 1234567890">
                </div>
                <div class="bankfleet-transfer-bank__field">
                    <label class="bankfleet-transfer-bank__label">Nombre del beneficiario</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-bank__input"
                        placeholder="Nombre completo">
                </div>
                <div class="bankfleet-transfer-bank__field">
                    <label class="bankfleet-transfer-bank__label">Documento</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-bank__input"
                        placeholder="CC / NIT">
                </div>

                <div class="bankfleet-transfer-bank__field">
                    <label class="bankfleet-transfer-bank__label">Monto</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-bank__amount-input"
                        placeholder="$0">
                </div>
                <div class="bankfleet-transfer-bank__field ">
                    <label class="bankfleet-transfer-bank__label">Concepto</label>
                    <textarea
                        class="bankfleet-transfer-bank__textarea"
                        placeholder="Descripción de la transferencia"
                    ></textarea>
                </div>
            </div>
        </form>
    </div>

    <div class="bankfleet-transfer-bank__union-summary-btn">
        <aside class="bankfleet-transfer-bank__summary">
            <h3 class="bankfleet-transfer-bank__summary-title">Resumen</h3>
            <div class="bankfleet-transfer-bank__summary-list">
                <div class="bankfleet-transfer-bank__summary-item"><span class="bankfleet-transfer-bank__summary-label">Banco</span><strong class="bankfleet-transfer-bank__summary-value">Bancolombia</strong></div>
                <div class="bankfleet-transfer-bank__summary-item"><span class="bankfleet-transfer-bank__summary-label">Tipo de cuenta</span><strong class="bankfleet-transfer-bank__summary-value">Ahorros</strong></div>
                <div class="bankfleet-transfer-bank__summary-item"><span class="bankfleet-transfer-bank__summary-label">Cuenta destino</span><strong class="bankfleet-transfer-bank__summary-value">****4587</strong></div>
                <div class="bankfleet-transfer-bank__summary-item"><span class="bankfleet-transfer-bank__summary-label">Beneficiario</span><strong class="bankfleet-transfer-bank__summary-value">Juan Pérez</strong></div>
                <div class="bankfleet-transfer-bank__summary-item"><span class="bankfleet-transfer-bank__summary-label">Monto</span><strong class="bankfleet-transfer-bank__summary-value">$250.000</strong></div>
                <div class="bankfleet-transfer-bank__summary-item"><span class="bankfleet-transfer-bank__summary-label">Comisión</span><strong class="bankfleet-transfer-bank__summary-value">$0</strong></div>
                <div class="bankfleet-transfer-bank__summary-item"><span class="bankfleet-transfer-bank__summary-label">Tiempo estimado</span><strong class="bankfleet-transfer-bank__summary-value">1–24 horas</strong></div>
            </div>
        </aside>
        <div class="bankfleet-transfer-bank__actions">
            <button type="button" class="bankfleet-btn bankfleet-btn--primary bankfleet-transfer-bank__btn-primary">Continuar
                <img src="/frontend/public/assets/icons/icon_next-white.svg" alt="" class="bankfleet-btn__icon">
            </button>
        </div>
    </div>
</section>
