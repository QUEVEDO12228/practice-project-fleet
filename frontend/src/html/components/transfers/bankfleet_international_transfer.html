<section class="bankfleet-transfer-international">
    <div class="bankfleet-transfer-international__content">
        <header class="bankfleet-transfer-international__header">
            <a href="/frontend/src/html/pages/dashboard/banking/transfers/cards/vista_bankfleet_new_transfer.html" class="bankfleet-btn-secondary">
                <img src="/frontend/public/assets/icons/icon_back.svg" alt="Atrás" class="bankfleet-btn-secondary__icon">
            </a>
            <div class="bankfleet-transfer-international__header-content">
                <h2 class="bankfleet-transfer-international__title">Transferencia Internacional</h2>
                <div class="bankfleet-transfer-international__header-texts">
                    <p class="bankfleet-transfer-international__subtitle">Envía dinero a bancos internacionales mediante códigos SWIFT, BIC o IBAN con seguimiento seguro.</p>
                    <span class="bankfleet-transfer-international__badge">Global</span>
                </div>
            </div>
        </header>
        <form class="bankfleet-transfer-international__form">
            <div class="bankfleet-transfer-international__grid">
                <div class="bankfleet-transfer-international__field">
                    <label class="bankfleet-transfer-international__label">Cuenta origen</label>
                    <select class="bankfleet-transfer-international__input">
                        <option>Cuenta Ahorros • ****4587</option>
                        <option>Cuenta Corriente • ****9831</option>
                    </select>
                </div>
                <div class="bankfleet-transfer-international__field">
                    <label class="bankfleet-transfer-international__label">País destino</label>
                    <select class="bankfleet-transfer-international__input">
                        <option>Estados Unidos</option>
                        <option>España</option>
                        <option>Reino Unido</option>
                        <option>Alemania</option>
                        <option>Canadá</option>
                        <option>Argentina</option>
                    </select>
                </div>
                <div class="bankfleet-transfer-international__field">
                    <label class="bankfleet-transfer-international__label">Banco internacional</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-international__input"
                        placeholder="Ej: Bank of America">
                </div>
                <div class="bankfleet-transfer-international__field">
                    <label class="bankfleet-transfer-international__label">SWIFT / BIC</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-international__input"
                        placeholder="Ej: BOFAUS3N">
                </div>
                <div class="bankfleet-transfer-international__field">
                    <label class="bankfleet-transfer-international__label">IBAN (opcional)</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-international__input"
                        placeholder="Ej: DE89 3704 0044 0532 0130 00">
                </div>
                <div class="bankfleet-transfer-international__field">
                    <label class="bankfleet-transfer-international__label">Nombre del beneficiario</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-international__input"
                        placeholder="Nombre completo">
                </div>
                <div class="bankfleet-transfer-international__field">
                    <label class="bankfleet-transfer-international__label">Monto</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-international__amount-input"
                        placeholder="$0">
                </div>
                <div class="bankfleet-transfer-international__field">
                    <label class="bankfleet-transfer-international__label">Concepto</label>
                    <textarea
                        class="bankfleet-transfer-international__textarea"
                        placeholder="Motivo de la transferencia internacional"
                    ></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="bankfleet-transfer-international__union-summary-btn">
        <aside class="bankfleet-transfer-international__summary">
            <h3 class="bankfleet-transfer-international__summary-title">Resumen</h3>
            <div class="bankfleet-transfer-international__summary-list">
                <div class="bankfleet-transfer-international__summary-item"><span class="bankfleet-transfer-international__summary-label">País</span><strong class="bankfleet-transfer-international__summary-value">Estados Unidos</strong></div>
                <div class="bankfleet-transfer-international__summary-item"><span class="bankfleet-transfer-international__summary-label">Banco</span><strong class="bankfleet-transfer-international__summary-value">Bank of America</strong></div>
                <div class="bankfleet-transfer-international__summary-item"><span class="bankfleet-transfer-international__summary-label">SWIFT</span><strong class="bankfleet-transfer-international__summary-value">BOFAUS3N</strong></div>
                <div class="bankfleet-transfer-international__summary-item"><span class="bankfleet-transfer-international__summary-label">Beneficiario</span><strong class="bankfleet-transfer-international__summary-value">John Smith</strong></div>
                <div class="bankfleet-transfer-international__summary-item"><span class="bankfleet-transfer-international__summary-label">Monto</span><strong class="bankfleet-transfer-international__summary-value">$2,500</strong></div>
                <div class="bankfleet-transfer-international__summary-item"><span class="bankfleet-transfer-international__summary-label">Comisión</span><strong class="bankfleet-transfer-international__summary-value">$25</strong></div>
                <div class="bankfleet-transfer-international__summary-item"><span class="bankfleet-transfer-international__summary-label">Tiempo estimado</span><strong class="bankfleet-transfer-international__summary-value">1–5 días</strong></div>
            </div>
        </aside>
        <div class="bankfleet-transfer-international__actions">
            <button type="button" class="bankfleet-btn bankfleet-btn--primary bankfleet-transfer-international__btn-primary bankfleet-btn--expand">
                <span class="bankfleet-btn__text">Continuar</span>
                <img src="/frontend/public/assets/icons/icon_next-white.svg" alt="->" class="bankfleet-btn__icon bankfleet-transfer-key__btn-icon">
            </button>
        </div>
    </div>
</section>
