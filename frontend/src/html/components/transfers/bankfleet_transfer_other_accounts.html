<section class="bankfleet-transfer-other-accounts">

    <div class="bankfleet-transfer-other-accounts__content">

        <header class="bankfleet-transfer-other-accounts__header">

            <a href="/frontend/src/html/pages/dashboard/banking/transfers/cards/vista_bankfleet_new_transfer.html" class="bankfleet-btn-secondary">
                <img
                    src="/frontend/public/assets/icons/icon_back.svg"
                    alt="Atrás"
                    class="bankfleet-btn-secondary__icon"
                >
            </a>

            <div class="bankfleet-transfer-other-accounts__header-content">

                <h2 class="bankfleet-transfer-other-accounts__title">
                    Otras Cuentas
                </h2>

                <div class="bankfleet-transfer-other-accounts__header-texts">

                    <p class="bankfleet-transfer-other-accounts__subtitle">
                        Transfiere fondos de tus productos para otras cuentas BANKFLEET de manera inmediata y sin costos adicionales.
                    </p>

                    <span class="bankfleet-transfer-other-accounts__badge">
                        Sin Comisión
                    </span>

                </div>

            </div>

        </header>

        <form class="bankfleet-transfer-other-accounts__form">

            <div class="bankfleet-transfer-other-accounts__grid">

                <div class="bankfleet-transfer-other-accounts__field">
                    <label class="bankfleet-transfer-other-accounts__label">Cuenta origen</label>
                    <select class="bankfleet-transfer-other-accounts__input">
                        <option>Cuenta Ahorros • ****4587</option>
                        <option>Cuenta Corriente • ****9831</option>
                    </select>
                </div>

                <div class="bankfleet-transfer-other-accounts__field">
                    <label class="bankfleet-transfer-other-accounts__label">Banco destino</label>
                    <select class="bankfleet-transfer-other-accounts__input">
                        <option>BANKFLEET</option>
                        <option>Banco externo (próximamente)</option>
                    </select>
                </div>

                <div class="bankfleet-transfer-other-accounts__field">
                    <label class="bankfleet-transfer-other-accounts__label">Monto</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-other-accounts__amount-input"
                        placeholder="$0"
                    >
                </div>

                <div class="bankfleet-transfer-other-accounts__field">
                    <label class="bankfleet-transfer-other-accounts__label">Número de cuenta</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-other-accounts__input"
                        placeholder="Ej: 1020304050"
                    >
                </div>

                <div class="bankfleet-transfer-other-accounts__field">
                    <label class="bankfleet-transfer-other-accounts__label">Nombre del beneficiario</label>
                    <input
                        type="text"
                        class="bankfleet-transfer-other-accounts__input"
                        placeholder="Se autocompletará o ingrésalo manualmente"
                    >
                </div>

                <div class="bankfleet-transfer-other-accounts__field">
                    <label class="bankfleet-transfer-other-accounts__label">Concepto</label>
                    <textarea
                        class="bankfleet-transfer-other-accounts__textarea"
                        placeholder="Descripción de la transferencia"
                    ></textarea>
                </div>

            </div>

        </form>

    </div>

    <div class="bankfleet-transfer-other-accounts__union-summary-btn">

        <aside class="bankfleet-transfer-other-accounts__summary">

            <h3 class="bankfleet-transfer-other-accounts__summary-title">
                Resumen
            </h3>

            <div class="bankfleet-transfer-other-accounts__summary-list">

                <div class="bankfleet-transfer-other-accounts__summary-item">
                    <span class="bankfleet-transfer-other-accounts__summary-label">Origen</span>
                    <strong class="bankfleet-transfer-other-accounts__summary-value">Cuenta Ahorros</strong>
                </div>

                <div class="bankfleet-transfer-other-accounts__summary-item">
                    <span class="bankfleet-transfer-other-accounts__summary-label">Banco destino</span>
                    <strong class="bankfleet-transfer-other-accounts__summary-value">BANKFLEET</strong>
                </div>

                <div class="bankfleet-transfer-other-accounts__summary-item">
                    <span class="bankfleet-transfer-other-accounts__summary-label">Cuenta destino</span>
                    <strong class="bankfleet-transfer-other-accounts__summary-value">****4587</strong>
                </div>

                <div class="bankfleet-transfer-other-accounts__summary-item">
                    <span class="bankfleet-transfer-other-accounts__summary-label">Beneficiario</span>
                    <strong class="bankfleet-transfer-other-accounts__summary-value">Juan Pérez</strong>
                </div>

                <div class="bankfleet-transfer-other-accounts__summary-item">
                    <span class="bankfleet-transfer-other-accounts__summary-label">Monto</span>
                    <strong class="bankfleet-transfer-other-accounts__summary-value">$250.000</strong>
                </div>

                <div class="bankfleet-transfer-other-accounts__summary-item">
                    <span class="bankfleet-transfer-other-accounts__summary-label">Comisión</span>
                    <strong class="bankfleet-transfer-other-accounts__summary-value">$0</strong>
                </div>

                <div class="bankfleet-transfer-other-accounts__summary-item">
                    <span class="bankfleet-transfer-other-accounts__summary-label">Tiempo estimado</span>
                    <strong class="bankfleet-transfer-other-accounts__summary-value">Instantáneo</strong>
                </div>

            </div>

        </aside>

        <div class="bankfleet-transfer-other-accounts__actions">

            <button type="button" class="bankfleet-btn bankfleet-btn--primary bankfleet-transfer-other-accounts__btn-primary">
                Continuar
                <img
                    src="/frontend/public/assets/icons/icon_next-white.svg"
                    alt=""
                    class="bankfleet-btn__icon"
                >
            </button>

        </div>

    </div>

</section>
