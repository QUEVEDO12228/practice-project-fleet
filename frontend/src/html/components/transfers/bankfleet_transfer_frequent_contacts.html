<section class="bankfleet-frequent-contacts">
    <div class="bankfleet-frequent-contacts__content">
        <header class="bankfleet-frequent-contacts__header">
            <a href="/frontend/src/html/pages/dashboard/banking/transfers/cards/vista_bankfleet_new_transfer.html" class="bankfleet-btn-secondary">
                <img src="/frontend/public/assets/icons/icon_back.svg" alt="Atrás" class="bankfleet-btn-secondary__icon">
            </a>
            <div class="bankfleet-frequent-contacts__header-content">
                <h2 class="bankfleet-frequent-contacts__title">Contactos Frecuentes</h2>
                <div class="bankfleet-frequent-contacts__header-texts">
                    <p class="bankfleet-frequent-contacts__subtitle">Selecciona destinatarios guardados previamente y realiza transferencias en segundos.</p>
                    <span class="bankfleet-frequent-contacts__badge">Favoritos</span>
                </div>
            </div>
        </header>
        <form class="bankfleet-frequent-contacts__form">
            <div class="bankfleet-frequent-contacts__grid">
                <div class="bankfleet-frequent-contacts__contacts">
                    <h3 class="bankfleet-frequent-contacts__section-title">Contactos</h3>
                    <div class="bankfleet-frequent-contacts__list">
                        <button type="button" class="bankfleet-frequent-contacts__card bankfleet-frequent-contacts__card--active">
                            <div class="bankfleet-frequent-contacts__avatar">JP</div>
                            <div class="bankfleet-frequent-contacts__info">
                                <strong>Juan Pérez</strong>
                                <span>****4587</span>
                            </div>
                        </button>
                        <button type="button" class="bankfleet-frequent-contacts__card">
                            <div class="bankfleet-frequent-contacts__avatar">MG</div>
                            <div class="bankfleet-frequent-contacts__info">
                                <strong>María Gómez</strong>
                                <span>****9831</span>
                            </div>
                        </button>
                        <button type="button" class="bankfleet-frequent-contacts__card">
                            <div class="bankfleet-frequent-contacts__avatar">LR</div>
                            <div class="bankfleet-frequent-contacts__info">
                                <strong>Luis Rodríguez</strong>
                                <span>****1122</span>
                            </div>
                        </button>
                    </div>
                </div>
                <div class="bankfleet-frequent-contacts__fields">
                    <div class="bankfleet-frequent-contacts__field">
                        <label class="bankfleet-frequent-contacts__label">Cuenta origen</label>
                        <select class="bankfleet-frequent-contacts__input">
                            <option>Cuenta Ahorros • ****4587</option>
                            <option>Cuenta Corriente • ****9831</option>
                        </select>
                    </div>
                    <div class="bankfleet-frequent-contacts__field">
                        <label class="bankfleet-frequent-contacts__label">Monto</label>
                        <input type="text" class="bankfleet-frequent-contacts__amount-input" placeholder="$0">
                    </div>
                    <div class="bankfleet-frequent-contacts__field bankfleet-frequent-contacts__field--full">
                        <label class="bankfleet-frequent-contacts__label">Concepto</label>
                        <textarea class="bankfleet-frequent-contacts__textarea" placeholder="Opcional"></textarea>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="bankfleet-frequent-contacts__union-summary-btn">
        <aside class="bankfleet-frequent-contacts__summary">
            <h3 class="bankfleet-frequent-contacts__summary-title">Resumen</h3>
            <div class="bankfleet-frequent-contacts__summary-list">
                <div class="bankfleet-frequent-contacts__summary-item"><span class="bankfleet-frequent-contacts__summary-label">Destinatario</span><strong class="bankfleet-frequent-contacts__summary-value">Juan Pérez</strong></div>
                <div class="bankfleet-frequent-contacts__summary-item"><span class="bankfleet-frequent-contacts__summary-label">Cuenta</span><strong class="bankfleet-frequent-contacts__summary-value">****4587</strong></div>
                <div class="bankfleet-frequent-contacts__summary-item"><span class="bankfleet-frequent-contacts__summary-label">Monto</span><strong class="bankfleet-frequent-contacts__summary-value">$250.000</strong></div>
                <div class="bankfleet-frequent-contacts__summary-item"><span class="bankfleet-frequent-contacts__summary-label">Comisión</span><strong class="bankfleet-frequent-contacts__summary-value">$0</strong></div>
                <div class="bankfleet-frequent-contacts__summary-item"><span class="bankfleet-frequent-contacts__summary-label">Tiempo</span><strong class="bankfleet-frequent-contacts__summary-value">Instantáneo</strong></div>
            </div>
        </aside>
        <div class="bankfleet-frequent-contacts__actions">
            <button class="bankfleet-btn bankfleet-btn--primary bankfleet-login__bankfleet-btn--primary bankfleet-frequent-contacts__btn-primary bankfleet-btn--expand">
                <span class="bankfleet-btn__text">Continuar</span>
                <img src="/frontend/public/assets/icons/icon_next-white.svg" alt="->" class="bankfleet-btn__icon bankfleet-transfer-key__btn-icon">
            </button>
        </div>
    </div>
</section>
