<section class="bankfleet-transfer-own-accounts">
    <div class="bankfleet-transfer-own-accounts__content">
        <header class="bankfleet-transfer-own-accounts__header">
            <a href="/frontend/src/html/pages/dashboard/banking/transfers/cards/vista_bankfleet_new_transfer.html" class="bankfleet-btn-secondary">
                <img src="/frontend/public/assets/icons/icon_back.svg" alt="Atrás" class="bankfleet-btn-secondary__icon">
            </a>
            <div class="bankfleet-transfer-own-accounts__header-content">
                <h2 class="bankfleet-transfer-own-accounts__title">Entre Mis Cuentas</h2>
                <div class="bankfleet-transfer-own-accounts__header-texts">
                    <p class="bankfleet-transfer-own-accounts__subtitle">Transfiere fondos entre tus productos BANKFLEET de manera inmediata y sin costos adicionales.</p>
                    <span class="bankfleet-transfer-own-accounts__badge">Sin Comisión</span>
                </div>
            </div>
        </header>
        <form class="bankfleet-transfer-own-accounts__form">
            <div class="bankfleet-transfer-own-accounts__grid">
                <div class="bankfleet-transfer-own-accounts__field">
                    <label class="bankfleet-transfer-own-accounts__label">Cuenta origen</label>
                    <select class="bankfleet-transfer-own-accounts__input">
                        <option>Cuenta Ahorros • ****4587</option>
                        <option>Cuenta Corriente • ****9831</option>
                    </select>
                </div>
                <div class="bankfleet-transfer-own-accounts__field">
                    <label class="bankfleet-transfer-own-accounts__label">Cuenta destino</label>
                    <select class="bankfleet-transfer-own-accounts__input">
                        <option>Cuenta Corriente • ****9831</option>
                        <option>Cuenta Ahorros • ****4587</option>
                    </select>
                </div>
                <div class="bankfleet-transfer-own-accounts__field">
                    <label class="bankfleet-transfer-own-accounts__label">Monto</label>
                    <input type="text" class="bankfleet-transfer-own-accounts__amount-input" placeholder="$0" >
                </div>
                <div class="bankfleet-transfer-own-accounts__field">
                    <label class="bankfleet-transfer-own-accounts__label">Referencia</label>
                    <input type="text" class="bankfleet-transfer-own-accounts__input" placeholder="Opcional" >
                </div>
                <div class="bankfleet-transfer-own-accounts__field ">
                    <label class="bankfleet-transfer-own-accounts__label">Concepto</label>
                    <textarea class="bankfleet-transfer-own-accounts__textarea" placeholder="Descripción de la transferencia"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="bankfleet-transfer-own-accounts__union-summary-btn">
        <aside class="bankfleet-transfer-own-accounts__summary">
            <h3 class="bankfleet-transfer-own-accounts__summary-title">Resumen</h3>
            <div class="bankfleet-transfer-own-accounts__summary-list">
                <div class="bankfleet-transfer-own-accounts__summary-item"><span class="bankfleet-transfer-own-accounts__summary-label">Origen</span><strong class="bankfleet-transfer-own-accounts__summary-value">Cuenta Ahorros</strong></div>
                <div class="bankfleet-transfer-own-accounts__summary-item"><span class="bankfleet-transfer-own-accounts__summary-label">Destino</span><strong class="bankfleet-transfer-own-accounts__summary-value">Cuenta Corriente</strong></div>
                <div class="bankfleet-transfer-own-accounts__summary-item"><span class="bankfleet-transfer-own-accounts__summary-label">Monto</span><strong class="bankfleet-transfer-own-accounts__summary-value">$250.000</strong></div>
                <div class="bankfleet-transfer-own-accounts__summary-item"><span class="bankfleet-transfer-own-accounts__summary-label">Comisión</span><strong class="bankfleet-transfer-own-accounts__summary-value">$0</strong></div>
                <div class="bankfleet-transfer-own-accounts__summary-item"><span class="bankfleet-transfer-own-accounts__summary-label">Tiempo estimado</span><strong class="bankfleet-transfer-own-accounts__summary-value">Instantáneo</strong></div>
            </div>
        </aside>
        <div class="bankfleet-transfer-own-accounts__actions">
            <button class="bankfleet-btn bankfleet-btn--primary bankfleet-login__bankfleet-btn--primary bankfleet-transfer-own-accounts__btn-primary bankfleet-btn--expand">
                <span class="bankfleet-btn__text">Continuar</span>
                <img src="/frontend/public/assets/icons/icon_next-white.svg" alt="->" class="bankfleet-btn__icon bankfleet-transfer-key__btn-icon">
            </button>
        </div>
    </div>
</section>
