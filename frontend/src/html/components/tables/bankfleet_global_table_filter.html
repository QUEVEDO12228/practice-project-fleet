<div class="bankfleet-filter-overlay"></div>

<aside class="bankfleet-filter-drawer">

    <header class="bankfleet-filter-drawer__header">

        <div class="bankfleet-filter-drawer__profile">

            <div class="bankfleet-filter-drawer__avatar">
                <img
                    src="/frontend/public/assets/icons/icon_filter_white.svg"
                    alt="Filtrar"
                    class="bankfleet-filter-drawer__avatar-icon">
            </div>

            <div class="bankfleet-filter-drawer__user">

                <h2 class="bankfleet-filter-drawer__title">
                    Filtrar
                </h2>

                <p class="bankfleet-filter-drawer__description">
                    Oculta temporalmente los datos que no necesitas y muestra únicamente aquellos que cumplen determinadas condiciones.
                </p>

            </div>

        </div>

        <button
            type="button"
            class="bankfleet-filter-drawer__close"
            aria-label="Cerrar filtros">

            ✕

        </button>

    </header>


    <div class="bankfleet-filter-drawer__body">


        <!-- Tipo de usuario -->
        <div class="bankfleet-filter-drawer__field">

            <label class="bankfleet-filter-drawer__label">
                Tipo de usuario
            </label>

            <div class="bankfleet-filter-drawer__input-wrapper">

                <img
                    src="/frontend/public/assets/icons/icon_user_purple.svg"
                    alt=""
                    class="bankfleet-filter-drawer__input-icon">

                <select class="bankfleet-filter-drawer__input">

                    <option selected>
                        Todos
                    </option>

                    <option>
                        Tarjeta Crédito
                    </option>

                    <option>
                        Cuenta
                    </option>

                    <option>
                        Cuenta CLABE
                    </option>

                </select>

            </div>

        </div>


        <!-- Tipo de alta -->
        <div class="bankfleet-filter-drawer__field">

            <label class="bankfleet-filter-drawer__label">
                Tipo de alta
            </label>

            <div class="bankfleet-filter-drawer__input-wrapper">

                <img
                    src="/frontend/public/assets/icons/icon_logs_purple.svg"
                    alt=""
                    class="bankfleet-filter-drawer__input-icon">

                <select class="bankfleet-filter-drawer__input">

                    <option selected>
                        Selecciona
                    </option>

                    <option>
                        Línea
                    </option>

                    <option>
                        Archivo
                    </option>

                </select>

            </div>

        </div>


        <!-- Cuenta origen -->
        <div class="bankfleet-filter-drawer__field">

            <label class="bankfleet-filter-drawer__label">
                Cuenta origen
            </label>

            <div class="bankfleet-filter-drawer__input-wrapper">

                <img
                    src="/frontend/public/assets/icons/icon_account_purple.svg"
                    alt=""
                    class="bankfleet-filter-drawer__input-icon">

                <select class="bankfleet-filter-drawer__input">

                    <option selected disabled>
                        Selecciona una de tus cuentas
                    </option>

                    <option>
                        Cuenta principal
                    </option>

                    <option>
                        Cuenta nómina
                    </option>

                    <option>
                        Cuenta ahorro
                    </option>

                </select>

            </div>

        </div>


        <!-- Fecha de alta -->
        <div class="bankfleet-filter-drawer__field">

            <label class="bankfleet-filter-drawer__label">
                Fecha de alta
            </label>

            <div class="bankfleet-filter-drawer__date-group">

                <input
                    type="date"
                    class="bankfleet-filter-drawer__input"
                    placeholder="Desde">

                <input
                    type="date"
                    class="bankfleet-filter-drawer__input"
                    placeholder="Hasta">

            </div>

        </div>


        <!-- Periodicidad -->
        <div class="bankfleet-filter-drawer__field">

            <label class="bankfleet-filter-drawer__label">
                Periodicidad
            </label>

            <div class="bankfleet-filter-drawer__input-wrapper">

                <img
                    src="/frontend/public/assets/icons/icon_calendar_search_purple.svg"
                    alt=""
                    class="bankfleet-filter-drawer__input-icon">

                <select class="bankfleet-filter-drawer__input">

                    <option selected>
                        Todos
                    </option>

                    <option>
                        Semanal
                    </option>

                    <option>
                        Quincenal
                    </option>

                    <option>
                        Mensual
                    </option>

                </select>

            </div>

        </div>


        <!-- Estado -->
        <div class="bankfleet-filter-drawer__field">

            <label class="bankfleet-filter-drawer__label">
                Estado
            </label>

            <div class="bankfleet-filter-drawer__input-wrapper">

                <img
                    src="/frontend/public/assets/icons/icon_status_purple.svg"
                    alt=""
                    class="bankfleet-filter-drawer__input-icon">

                <select class="bankfleet-filter-drawer__input">

                    <option selected>
                        Todos
                    </option>

                    <option>
                        Aplicado
                    </option>

                    <option>
                        Cancelado
                    </option>

                </select>

            </div>

        </div>


        <!-- Banco -->
        <div class="bankfleet-filter-drawer__field">

            <label class="bankfleet-filter-drawer__label">
                Banco
            </label>

            <div class="bankfleet-filter-drawer__input-wrapper">

                <img
                    src="/frontend/public/assets/icons/icon_bank_purple.svg "
                    alt=""
                    class="bankfleet-filter-drawer__input-icon">

                <select class="bankfleet-filter-drawer__input">

                    <option selected>
                        Todos
                    </option>

                    <option>
                        Cuentas propias
                    </option>

                    <option>
                        Terceros
                    </option>

                    <option>
                        BBVA Colombia
                    </option>

                    <option>
                        Bancolombia
                    </option>

                    <option>
                        Davivienda
                    </option>

                    <option>
                        Banco de Bogotá
                    </option>

                    <option>
                        Banco Popular
                    </option>

                    <option>
                        Banco Agrario
                    </option>

                </select>

            </div>

        </div>


    </div>


    <footer class="bankfleet-filter-drawer__footer">

        <button
            type="button"
            class="bankfleet-btn-secondary">

            Limpiar filtros

        </button>


        <button
            type="button"
            class="bankfleet-btn bankfleet-btn--primary">

            Aplicar filtros

            <img
                src="/frontend/public/assets/icons/icon_next-white.svg"
                alt=""
                class="bankfleet-btn__icon">

        </button>

    </footer>


</aside>
