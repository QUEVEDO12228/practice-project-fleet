<section class="bankfleet-profile-page">

    <div class="bankfleet-profile-page__glow bankfleet-profile-page__glow--left"></div>
    <div class="bankfleet-profile-page__glow bankfleet-profile-page__glow--right"></div>
    <section class="bankfleet-profile">
        <div class="bankfleet-profile__card">
            <div class="bankfleet-profile__topbar">
                <a href="javascript:history.back()" alt="Volver" class="bankfleet-btn-secondary bankfleet-transactions-table__btn-secondary">
                    <img src="/frontend/public/assets/icons/icon_back.svg"alt=""class="bankfleet-btn-secondary__icon">
                </a>
                <h2 class="bankfleet-profile__title">Mi Perfil</h2>
                <p class="bankfleet-profile__subtitle">Actualiza la información personal asociada a tu cuenta<strong class="bankfleet-profile__highlight">BANKFLEET</strong></p>
            </div>
            <form class="bankfleet-profile__form">
                <div class="bankfleet-profile__row">
                    <section class="bankfleet-avatar-editor">
                        <div class="bankfleet-avatar-editor__preview">
                            <img src="/frontend/public/assets/images/profile-default.png"alt="Foto de perfil"class="bankfleet-avatar-editor__image">
                            <label for="profile-image"class="bankfleet-avatar-editor__overlay">
                                <img src="/frontend/public/assets/icons/icon_camera_purple.svg"alt=""class="bankfleet-avatar-editor__icon">
                            </label>
                            <input type="file" id="profile-image" class="bankfleet-avatar-editor__input" accept="image/*">
                        </div>
                        <div class="bankfleet-avatar-editor__content">
                            <h2 class="bankfleet-avatar-editor__title">Foto de perfil</h2>
                            <p class="bankfleet-avatar-editor__description">Actualiza tu imagen para personalizar tu cuenta BANKFLEET.</p>
                        </div>
                    </section>
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Nombre</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_name_user.svg" alt="" class="bankfleet-profile__input-icon">
                            <input type="text" class="bankfleet-profile__input" placeholder="Pepito">
                        </div>
                    </div>
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Apellidos</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_name_user.svg" alt="" class="bankfleet-profile__input-icon">
                            <input type="text" class="bankfleet-profile__input" placeholder="Pérez">
                        </div>
                    </div>
                </div>
                <div class="bankfleet-profile__row">
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Tipo de documento</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_id.svg"alt=""class="bankfleet-profile__input-icon">
                            <select class="bankfleet-profile__input">
                                <option>CC</option><option>CE</option><option>TI</option><option>Pasaporte</option>
                            </select>
                        </div>
                    </div>
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Número de documento </label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_id.svg" alt="" class="bankfleet-profile__input-icon">
                            <input type="text" class="bankfleet-profile__input" placeholder="123456789">
                        </div>
                    </div>
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Teléfono</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_phone.svg" alt="" class="bankfleet-profile__input-icon">
                            <input type="tel" class="bankfleet-profile__input" placeholder="3001234567">
                        </div>
                    </div>
                </div>
                <div class="bankfleet-profile__row">
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Correo electrónico</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_email.svg" alt="" class="bankfleet-profile__input-icon">
                            <input type="email" class="bankfleet-profile__input" placeholder="correo@bankfleet.com">
                        </div>
                    </div>
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">País</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_country_purple.svg"class="bankfleet-register-address__input-icon"alt="">
                            <select class="bankfleet-register-address__input">
                                <option selected disabled>Selecciona un país</option>
                                <option>Colombia</option>
                                <option>México</option>
                                <option>Perú</option>
                                <option>Chile</option>
                                <option>Ecuador</option>
                            </select>
                        </div>
                    </div>
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Departamento</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_map_purple.svg"class="bankfleet-register-address__input-icon"alt="">
                            <input type="text" class="bankfleet-register-address__input" placeholder="Ej: Risaralda">
                        </div>
                    </div>
                </div>
                <div class="bankfleet-profile__row">
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Ciudad</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_city_purple.svg" class="bankfleet-register-address__input-icon" alt="">
                            <input type="text" class="bankfleet-register-address__input" placeholder="Ej: Pereira">
                        </div>
                    </div>
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Dirección</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_direction_purple.svg" class="bankfleet-register-address__input-icon" alt="">
                            <input type="text" class="bankfleet-register-address__input" placeholder="Ej: Calle 10 # 25 - 60">
                        </div>
                    </div>
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Complemento (Opcional)</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_information_purple.svg" class="bankfleet-register-address__input-icon" alt="">
                            <input type="text" class="bankfleet-register-address__input" placeholder="Apto, Torre, Interior...">
                        </div>
                    </div>
                </div>
                <div class="bankfleet-profile__row">
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Código postal</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_code_postal_purple.svg" class="bankfleet-register-address__input-icon" alt="">
                            <input type="text" class="bankfleet-register-address__input" placeholder="Ej: 660001">
                        </div>
                    </div>
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Tipo de vivienda</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_type_purple.svg" class="bankfleet-register-address__input-icon"alt="">
                            <select class="bankfleet-register-address__input">
                                <option selected disabled>Selecciona una opción</option>
                                <option>Propia</option>
                                <option>Arrendada</option>
                                <option>Familiar</option>
                                <option>Otra</option>
                            </select>
                        </div>
                    </div>
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Tipo Vía</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_type_via_purple.svg"class="bankfleet-register-address__input-icon"alt="">
                            <select class="bankfleet-register-address__input">
                                <option selected disabled>Selecciona un país</option>
                                <option>Carrera</option>
                                <option>Calle</option>
                                <option>Diagonal</option>
                                <option>Trasversal</option>
                                <option>Avenida</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="bankfleet-profile__row">
                    <div class="bankfleet-profile__field">
                        <label class="bankfleet-profile__label">Numero de Vía y casa</label>
                        <div class="bankfleet-profile__input-wrapper">
                            <img src="/frontend/public/assets/icons/icon_number_purple.svg" class="bankfleet-register-address__input-icon" alt="">
                            <input type="text" class="bankfleet-register-address__input" placeholder="Ej: 660001">
                        </div>
                    </div>
                </div>
                <div class="bankfleet-profile__status">
                    <span class="bankfleet-profile__status-badge">✓ Verificado</span>
                    <span class="bankfleet-profile__status-text">Tu identidad fue validada correctamente.</span>
                </div>
                <div class="bankfleet-profile__actions">
                     <div class="bankfleet-profile__field-password">
                        <a href="/frontend/src/html/pages/dashboard/vista_dashboard.html" class="bankfleet-btn-secondary">Editar Contraseña
                            <img src="/frontend/public/assets/icons/icon_key_white.svg" alt="" class="bankfleet-btn-secondary__icon">
                        </a>
                    </div>
                    <button type="submit" class="bankfleet-btn bankfleet-btn--primary bankfleet-btn--expand">
                        <span class="bankfleet-btn__text">Guardar cambios</span>
                        <img src="/frontend/public/assets/icons/icon_save_white.svg" alt="" class="bankfleet-btn__icon">
                    </button>
                </div>
            </form>
        </div>
    </section>
</section>
