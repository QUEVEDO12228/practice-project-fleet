<!-- =========================================================
BANKFLEET CODE VERIFY (STYLE STEP 1)
========================================================= -->
<section class="bankfleet-code-verify-page">

  <!-- BACKGROUND GLOW -->
  <div class="bankfleet-code-verify-page__glow bankfleet-code-verify-page__glow--left"></div>
  <div class="bankfleet-code-verify-page__glow bankfleet-code-verify-page__glow--right"></div>

  <div class="bankfleet-code-verify-layout">

    <!-- =====================================================
    LEFT SIDE
    ====================================================== -->
    <section class="bankfleet-code-verify">

      <div class="bankfleet-code-verify__card">

        <!-- TOPBAR -->
        <div class="bankfleet-code-verify__topbar">

          <a href="vista_forgot_password.html"
             class="bankfleet-btn-secondary">

            <img
              src="/frontend/public/assets/icons/icon_back.svg"
              alt=""
              class="bankfleet-btn-secondary__icon">
              

          </a>

        </div>

        <!-- HEADER -->
        <header class="bankfleet-code-verify__header">

          <h2 class="bankfleet-code-verify__title">
            Verifica tu código
          </h2>

          <p class="bankfleet-code-verify__subtitle">
            Hemos enviado un código a tu correo registrado en
            <strong class="bankfleet-code-verify__highlight">
              BANKFLEET
            </strong>
            <br>
            Ingrésalo para continuar con la recuperación de tu cuenta.
          </p>

        </header>

        <!-- FORM -->
        <form class="bankfleet-code-verify__form">

          <!-- CODE INPUTS -->
          <div class="bankfleet-code-box">

            <input maxlength="1" type="text" class="bankfleet-code-verify__input">
            <input maxlength="1" type="text" class="bankfleet-code-verify__input">
            <input maxlength="1" type="text" class="bankfleet-code-verify__input">
            <input maxlength="1" type="text" class="bankfleet-code-verify__input">
            <input maxlength="1" type="text" class="bankfleet-code-verify__input">
            <input maxlength="1" type="text" class="bankfleet-code-verify__input">

          </div>

          <!-- BUTTON -->
          <div class="bankfleet-code-verify__button-primary">

            <button
              type="button"
              class="bankfleet-btn bankfleet-btn--primary">

              Verificar código

              <img
                src="/frontend/public/assets/icons/icon_mail-check.svg"
                class="bankfleet-btn__icon"
                alt="">

            </button>

          </div>

        </form>

      </div>

    </section>

    <!-- =====================================================
    RIGHT SIDE
    ====================================================== -->
    <aside class="bankfleet-code-verify-banner">

      <img
        src="/frontend/public/assets/img/img_home_forgot_password.JPG"
        class="bankfleet-code-verify-banner__image"
        alt="">

      <div class="bankfleet-code-verify-banner__overlay"></div>

      <div class="bankfleet-code-verify-banner__card">

        <span class="bankfleet-code-verify-banner__badge">
          BANKFLEET SECURITY
        </span>

        <h2 class="bankfleet-code-verify-banner__title">
          Verificación segura
        </h2>

        <p class="bankfleet-code-verify-banner__text">
          Protegemos tu cuenta con autenticación de dos pasos.
        </p>

      </div>

    </aside>

  </div>

</section>
