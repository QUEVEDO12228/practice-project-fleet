<section class="bankfleet-register-step6-page">
  <div class="bankfleet-register-step6-page__glow bankfleet-register-step6-page__glow--left"></div>
  <div class="bankfleet-register-step6-page__glow bankfleet-register-step6-page__glow--right"></div>
  <div class="bankfleet-register-step6-layout">
    <section class="bankfleet-register-step6">
      <div class="bankfleet-register-step6__card">
        <div class="bankfleet-register-step6__topbar">
          <a href="vista_register_step5.html"class="bankfleet-btn-secondary">
            <img src="/frontend/public/assets/icons/icon_back.svg" alt="" class="bankfleet-btn-secondary__icon">
          </a>
        </div>
        <header class="bankfleet-register-step6__header">
          <h6 class="bankfleet-register-step6__title">Completa tu registro</h6>
          <p class="bankfleet-register-step6__subtitle">Último paso para crear tu cuenta en<strong class="bankfleet-register-step6__highlight">BANKFLEET</strong></p>
        </header>
        <form class="bankfleet-register-step6__form">
          <div class="bankfleet-register-step6__field">
            <label class="bankfleet-register-step6__label">Foto de perfil</label>
            <div class="bankfleet-register-step6__photo-upload">
              <div class="bankfleet-register-step6__photo-preview">
                <img src="/frontend/public/assets/icons/icon_user_placeholder.svg" alt="Foto de perfil" class="bankfleet-register-step6__photo-img">
                <button type="button" class="bankfleet-register-step6__photo-btn"><img src="/frontend/public/assets/icons/icon_camera.svg" alt=""></button>
              </div>
              <input type="file" accept="image/*" class="bankfleet-register-step6__photo-input">
              <p class="bankfleet-register-step6__photo-hint">JPG, PNG o WEBP. Máx 5MB</p>
            </div>
          </div>
          <div class="bankfleet-register-step6__field">
            <label class="bankfleet-register-step6__label">Correo electrónico</label>
            <div class="bankfleet-register-step6__input-wrapper">
              <img src="/frontend/public/assets/icons/icon_email.svg" class="bankfleet-register-step6__input-icon" alt="">
              <input type="email" class="bankfleet-register-step6__input" placeholder="correo@bankfleet.com">
            </div>
          </div>
          <div class="bankfleet-register-step6__field">
            <label class="bankfleet-register-step6__label">Contraseña</label>
            <div class="bankfleet-register-step6__input-wrapper">
              <img src="/frontend/public/assets/icons/icon_password.svg" class="bankfleet-register-step6__input-icon" alt="">
              <input type="password" class="bankfleet-register-step6__input bankfleet-register-step6__input--password" placeholder="********">
              <button type="button" class="bankfleet-register-step6__toggle-password">
                <img src="/frontend/public/assets/icons/icon_open-eye.svg" alt="">
              </button>
            </div>
          </div>
          <div class="bankfleet-register-step6__field">
            <label class="bankfleet-register-step6__label">Confirmar contraseña</label>
            <div class="bankfleet-register-step6__input-wrapper">
              <img src="/frontend/public/assets/icons/icon_password.svg" class="bankfleet-register-step6__input-icon" alt="">
              <input type="password" class="bankfleet-register-step6__input" placeholder="********">
            </div>
          </div>
          <div class="bankfleet-register-step6__button-primary">
            <buttontype="button" class="bankfleet-btn bankfleet-btn--primary">Crear cuenta
              <img src="/frontend/public/assets/icons/icon_create.svg" class="bankfleet-btn__icon" alt="">
            </button>
          </div>
        </form>
      </div>
    </section>
    <aside class="bankfleet-register-step6-banner">
      <img src="/frontend/public/assets/img/img_register_step6.webp" class="bankfleet-register-step6-banner__image" alt="">
      <div class="bankfleet-register-step6-banner__overlay"></div>
      <div class="bankfleet-register-step6-banner__card">
        <span class="bankfleet-register-step6-banner__badge">BANKFLEET SECURITY</span>
        <h6 class="bankfleet-register-step6-banner__title">Seguridad avanzada</h6>
        <p class="bankfleet-register-step6-banner__text">Protegemos tu cuenta con tecnología de última generación.</p>
      </div>
    </aside>
  </div>
</section>
