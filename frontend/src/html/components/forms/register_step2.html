<!-- =========================================================
BANKFLEET REGISTER STEP 2 PAGE
========================================================= -->
<section class="bankfleet-register-step2-page">

  <!-- BACKGROUND GLOW -->
  <div class="bankfleet-register-step2-page__glow bankfleet-register-step2-page__glow--left"></div>
  <div class="bankfleet-register-step2-page__glow bankfleet-register-step2-page__glow--right"></div>

  <div class="bankfleet-register-step2-layout">

    <!-- =====================================================
    LEFT SIDE
    ====================================================== -->
    <section class="bankfleet-register-step2">

      <div class="bankfleet-register-step2__card">

        <!-- TOPBAR -->
        <div class="bankfleet-register-step2__topbar">

          <a href="vista_register_step1.html"
             class="bankfleet-btn-secondary">

            <img
              src="/frontend/public/assets/icons/icon_back.svg"
              alt=""
              class="bankfleet-btn-secondary__icon">

          </a>

        </div>

        <!-- HEADER -->
        <header class="bankfleet-register-step2__header">

          <h2 class="bankfleet-register-step2__title">
            Completa tu registro
          </h2>

          <p class="bankfleet-register-step2__subtitle">
            Último paso para crear tu cuenta en
            <strong class="bankfleet-register-step2__highlight">
              BANKFLEET
            </strong>
          </p>

        </header>

        <!-- FORM -->
        <form class="bankfleet-register-step2__form">

          <!-- FOTO DE PERFIL -->
          <div class="bankfleet-register-step2__field">

            <label class="bankfleet-register-step2__label">
              Foto de perfil
            </label>

            <div class="bankfleet-register-step2__photo-upload">

              <!-- PREVIEW -->
              <div class="bankfleet-register-step2__photo-preview">

                <img
                  src="/frontend/public/assets/icons/icon_user_placeholder.svg"
                  alt="Foto de perfil"
                  class="bankfleet-register-step2__photo-img">

                <button type="button" class="bankfleet-register-step2__photo-btn">
                  <img src="/frontend/public/assets/icons/icon_camera.svg" alt="">
                </button>

              </div>

              <!-- INPUT FILE OCULTO -->
              <input
                type="file"
                accept="image/*"
                class="bankfleet-register-step2__photo-input">

              <p class="bankfleet-register-step2__photo-hint">
                JPG, PNG o WEBP. Máx 5MB
              </p>

            </div>

          </div>

          <!-- CORREO -->
          <div class="bankfleet-register-step2__field">

            <label class="bankfleet-register-step2__label">
              Correo electrónico
            </label>

            <div class="bankfleet-register-step2__input-wrapper">

              <img
                src="/frontend/public/assets/icons/icon_email.svg"
                class="bankfleet-register-step2__input-icon"
                alt="">

              <input
                type="email"
                class="bankfleet-register-step2__input"
                placeholder="correo@bankfleet.com">

            </div>

          </div>

          <!-- CONTRASEÑA -->
          <div class="bankfleet-register-step2__field">

            <label class="bankfleet-register-step2__label">
              Contraseña
            </label>

            <div class="bankfleet-register-step2__input-wrapper">

              <img
                src="/frontend/public/assets/icons/icon_password.svg"
                class="bankfleet-register-step2__input-icon"
                alt="">

              <input
                type="password"
                class="bankfleet-register-step2__input bankfleet-register-step2__input--password"
                placeholder="********">

              <button type="button"
                      class="bankfleet-register-step2__toggle-password">

                <img
                  src="/frontend/public/assets/icons/icon_open-eye.svg"
                  alt="">

              </button>

            </div>

          </div>

          <!-- CONFIRMAR CONTRASEÑA -->
          <div class="bankfleet-register-step2__field">

            <label class="bankfleet-register-step2__label">
              Confirmar contraseña
            </label>

            <div class="bankfleet-register-step2__input-wrapper">

              <img
                src="/frontend/public/assets/icons/icon_password.svg"
                class="bankfleet-register-step2__input-icon"
                alt="">

              <input
                type="password"
                class="bankfleet-register-step2__input"
                placeholder="********">

            </div>

          </div>

          <!-- BUTTON -->
          <div class="bankfleet-register-step2__button-primary">

            <button
              type="button"
              class="bankfleet-btn bankfleet-btn--primary">

              Crear cuenta

              <img
                src="/frontend/public/assets/icons/icon_create.svg"
                class="bankfleet-btn__icon"
                alt="">

            </button>

          </div>

        </form>

      </div>

    </section>

    <!-- =====================================================
    RIGHT SIDE
    ====================================================== -->
    <aside class="bankfleet-register-step2-banner">

      <img
        src="/frontend/public/assets/img/img_register_step2.webp"
        class="bankfleet-register-step2-banner__image"
        alt="">

      <div class="bankfleet-register-step2-banner__overlay"></div>

      <div class="bankfleet-register-step2-banner__card">

        <span class="bankfleet-register-step2-banner__badge">
          BANKFLEET SECURITY
        </span>

        <h2 class="bankfleet-register-step2-banner__title">
          Seguridad avanzada
        </h2>

        <p class="bankfleet-register-step2-banner__text">
          Protegemos tu cuenta con tecnología de última generación.
        </p>

      </div>

    </aside>

  </div>

</section>
